name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
        env:
          BASE_PATH: /mma/
          # Set the repo secret LLM_PROXY_URL to your Cloudflare Worker URL
          # (e.g. https://minimax-proxy.<acct>.workers.dev/v1/chat/completions)
          # to enable vision upload + analyze report on the static deploy.
          # Without it the LLM features show a "no backend" message.
          VITE_LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          force_orphan: true
          enable_jekyll: false
