name = "openai-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# CORS - set to your GitHub Pages origin (or "*" to allow all, less safe).
# Use `wrangler secret put ALLOWED_ORIGIN` to override at deploy time without
# committing.
# [vars]
# ALLOWED_ORIGIN = "https://yip-lgtm.github.io"

[observability]
enabled = true

[dev]
port = 8787
ip = "127.0.0.1"
