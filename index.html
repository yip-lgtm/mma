<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>outboxing stance</title>
<meta name="theme-color" content="#000000" />
<style>
  :root { --bg:#000; --fg:#fff; --muted:#c4c4c4; --line:#2a2a2a; --card:#111; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 "Noto Sans TC", system-ui, sans-serif; }
  a { color:var(--fg); }
  .wrap { max-width:28rem; margin:0 auto; padding:1.25rem 1rem 6rem; }
  h1 { font-size:1.7rem; margin:0; letter-spacing:-.03em; }
  h2 { font-size:1.15rem; margin:0 0 .4rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-top:.85rem; }
  button, .btn { appearance:none; border:0; border-radius:10px; background:#fff; color:#000; height:44px; padding:0 14px; font-weight:600; cursor:pointer; }
  a.btn { background:#1a1a1a; color:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; text-decoration:none; }
  input { width:100%; height:40px; background:#1a1a1a; color:#fff; border:1px solid var(--line); border-radius:8px; padding:0 10px; }
  label { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  nav { position:fixed; left:0; right:0; bottom:0; background:#000; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); }
  nav a { color:var(--muted); text-align:center; padding:12px 0 16px; text-decoration:none; font-size:12px; }
  nav a.on { color:#fff; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:6px 10px; margin:4px 4px 0 0; font-size:12px; color:var(--muted); background:#1a1a1a; }
  pre { white-space:pre-wrap; font:13px/1.5 ui-sans-serif, system-ui; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav>
  <a href="#/" id="n-home">今日</a>
  <a href="#/week" id="n-week">週期</a>
  <a href="#/weight" id="n-weight">體重</a>
  <a href="#/skills" id="n-skills">技術</a>
</nav>
<script>
const K = "yipmma-v3";
const GH_NEW = "https://github.com/settings/tokens/new?description=yipmma-backup&scopes=repo";
const days = [
  {n:"一 腳步節奏", i:"碎步、前後步、側步。唔鎖死。"},
  {n:"二 刺拳測距", i:"前腳輕踩同時出刺拳，即收回，側步離開。"},
  {n:"三 Pivot 轉角", i:"前腳為軸，後腳划弧 45–90 度。"},
  {n:"四 單腳穩定", i:"2合1：深蹴3 + 保加利亞蹴左右各 8。"},
  {n:"五 環繞節奏", i:"向對手弱手外側走弧，直線後退最少。"},
  {n:"六 頭同距離", i:"距離先對，後仰來自髓，讓完即回擊或離開。"},
  {n:"日 輕移動", i:"慢碎步 + 刺拳空擊。唔加長有氧。"}
];
const skills = [
  ["外圍架勢","前腳指向對手，後腳外開約 45 度，前後距離約一步。膝微屈。前手可較低準備刺拳。後手靠近下頬。"],
  ["刺拳","前腳輕踩同時打出。打直但不鎖死肘。立刻沿原路回收。打完即側步。"],
  ["Pivot 轉角","前腳為軸，後腳向外側划弧，身體轉 45–90 度。轉完立刻可打。視線保持對手。"],
  ["簡化滑步","雙腳碎步交換，幅度細。上身平穩。隨時可停再刺拳。唔連續跳。"],
  ["頭同距離","對手打直拳剛好差一點。後仰來自髓同後腳。讓完一定有回擊或離開。"],
  ["環繞節奏","向對手弱手外側移動。優先側移同轉角。用刺拳付費。每 3–5 秒改節奏。"]
];
function load(){ try { return JSON.parse(localStorage.getItem(K)||"{}"); } catch { return {}; } }
function save(p){ const s={...load(),...p}; localStorage.setItem(K, JSON.stringify(s)); return s; }
function today(){ return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Hong_Kong"}); }
function wd(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Hong_Kong"})); return (d.getDay()+6)%7; }
function el(html){ document.getElementById("app").innerHTML = html; }
function nav(){ ["home","week","weight","skills"].forEach(id=>document.getElementById("n-"+id).className = location.hash.includes(id)||(id==="home"&&(location.hash===""||location.hash==="#/")) ? "on":""); }
function pageHome(){
  const d = days[wd()];
  el(`<h1>outboxing stance</h1><p class="muted">練拳不練功到老一場空 · 康文署 30 分鐘</p>
    <div class="card"><h2>${d.n}</h2><p>${d.i}</p>
      <p class="muted">後半：引體 → 胸 → 二頭 → 腹 → 2合1大腿（超哥深蹴即接保加利亞蹴）× 3</p>
      <p class="muted">跟超哥系列，練完即食熱小米粥。</p></div>
    <div class="card"><h2>超哥每日健身</h2>
      <a class="chip" href="https://youtube.com/shorts/qpgtrzJpSIE" target="_blank">短片 1</a>
      <a class="chip" href="https://youtube.com/shorts/9g8fGj_fO_g" target="_blank">短片 2</a>
      <a class="chip" href="https://youtube.com/shorts/8tTcdROhKk4" target="_blank">短片 3</a>
      <a class="chip" href="https://youtube.com/shorts/sJbZVqZc7KA" target="_blank">短片 4</a>
      <a class="chip" href="https://youtube.com/shorts/dDMEsWZW6yg" target="_blank">短片 5</a></div>`);
}
function pageWeek(){ el(`<h1>週期</h1>` + days.map((d,i)=>`<div class="card"><h2>${d.n}${i===wd()?" · 今日":""}</h2><p class="muted">${d.i}</p></div>`).join("")); }
function pageSkills(){ el(`<h1>技術庫</h1><p class="muted">阿里早期／洛馬琴科：可隨時移動，唔鎖死。</p>` + skills.map(([n,t])=>`<div class="card"><h2>${n}</h2><p>${t}</p></div>`).join("")); }
function pageWeight(){
  const s = load();
  el(`<h1>體重 · 飲食</h1><p class="muted">168 cm · 上限 55 kg · 目標 54.5 kg</p>
    <div class="card"><h2>記入體脂磅</h2><p class="muted">只填四個。</p>
      <div class="row">
        <label>體重 kg<input id="kg" value="${s.kg||""}" inputmode="decimal"></label>
        <label>體脂 %<input id="fat" value="${s.fat||""}" inputmode="decimal"></label>
        <label>肌肉 kg<input id="mus" value="${s.mus||""}" inputmode="decimal"></label>
        <label>BMR<input id="bmr" value="${s.bmr||""}" inputmode="decimal"></label>
      </div>
      <button style="width:100%;margin-top:12px" onclick="saveScan()">保存今日磅數</button></div>
    <div class="card"><h2>今日已吃</h2>
      <input id="food" placeholder="例如：熱小米粥、白切鴾">
      <button style="width:100%;margin-top:8px" onclick="addFood()">加入</button>
      <div>${(s.foods||[]).filter(f=>f.d===today()).map(f=>`<div class="muted">${f.t}</div>`).join("")||`<p class="muted">未記。</p>`}</div></div>
    <div class="card"><h2>分析報告</h2><p class="muted">OpenRouter · minimax/minimax-m3:free</p>
      <label>OpenRouter API key<input id="or" type="password" value="${s.or||""}" placeholder="sk-or-…"></label>
      <button style="width:100%;margin-top:10px" onclick="runLLM()">產生今日報告（MiniMax M3）</button>
      <pre id="rep">${s.report||""}</pre></div>
    <div class="card"><h2>自動備份</h2>
      <p class="muted">Token 貼上即存呢部手機。Repo 預設 yip-lgtm/yipmma-data。</p>
      <a class="btn" href="${GH_NEW}" target="_blank">1. 開 GitHub token（勾 repo）</a>
      <label>2. GitHub token（contents:write）<input id="tok" type="password" value="${s.tok||""}" placeholder="ghp_…" oninput="save({tok:this.value})"></label>
      <label>Repo<input id="repo" value="${s.repo||"yip-lgtm/yipmma-data"}"></label>
      <button style="width:100%;margin-top:10px" onclick="pushGh()">3. 測試 git push</button>
      <p class="muted" id="ghst">${s.ghst||""}</p></div>`);
}
async function saveScan(){ save({kg:kg.value,fat:fat.value,mus:mus.value,bmr:bmr.value,date:today()}); await maybePush(); alert("已保存"); pageWeight(); }
function addFood(){ const t=food.value.trim(); if(!t) return; const s=load(); const foods=s.foods||[]; foods.push({d:today(),t}); save({foods}); pageWeight(); }
async function runLLM(){
  const s=save({or:or.value}); if(!s.or){ alert("請填 OpenRouter API key"); return; }
  try{
    const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.or,"HTTP-Referer":"https://yip-lgtm.github.io/mma/","X-Title":"outboxing stance"},body:JSON.stringify({model:"minimax/minimax-m3:free",max_tokens:1200,temperature:0.4,messages:[{role:"system",content:"你是香港私人教練。用繁體中文口語。168cm 男性，外圍拳擊，目標 55kg 以下。五段：1狀態 2同55kg關係 3飲食同明日三個食法 4九分鐘跑 5訓練。禁止極端節食。練完小米粥。"},{role:"user",content:JSON.stringify({kg:s.kg,fat:s.fat,mus:s.mus,bmr:s.bmr,foods:(s.foods||[]).slice(-20)})}]})});
    const j=await r.json(); save({report:j.choices?.[0]?.message?.content || ("失敗 "+r.status)}); await maybePush(); pageWeight();
  }catch(e){ alert("OpenRouter 連唔到："+e.message); }
}
async function pushGh(){
  const s=save({tok:tok.value, repo:repo.value||"yip-lgtm/yipmma-data"}); if(!s.tok){ alert("未填 token"); return; }
  const [owner,name]=s.repo.split("/"); const api=`https://api.github.com/repos/${owner}/${name}/contents/backup/data.json`;
  const headers={Authorization:"Bearer "+s.tok, Accept:"application/vnd.github+json"};
  let sha; const g=await fetch(api,{headers}); if(g.ok) sha=(await g.json()).sha;
  const content=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,at:Date.now(),...s,tok:undefined,or:undefined},null,2))));
  const p=await fetch(api,{method:"PUT",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({message:"backup "+today(),content,branch:"main",sha})});
  save({ghst:p.ok?"已 git push":"push 失敗 "+p.status}); pageWeight();
}
async function maybePush(){ const s=load(); if(s.tok){ try{ await pushGh(); }catch(e){} } }
function route(){ const h=location.hash.replace("#","")||"/"; nav(); if(h.startsWith("/week")) pageWeek(); else if(h.startsWith("/weight")) pageWeight(); else if(h.startsWith("/skills")) pageSkills(); else pageHome(); }
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
